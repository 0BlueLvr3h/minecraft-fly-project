name: Mosca
version: '${version}'
main: it.project.fly.MoscaPlugin
api-version: '26.3'
description: An Allay driven by the fruit-fly connectome (FlyWire)

commands:
  mosca:
    description: Manages the flies
    usage: /mosca <spawn [force]|remove [all]|tp [number]|status|debug>
    permission: mosca.admin

permissions:
  mosca.admin:
    description: Allows managing the flies
    default: op

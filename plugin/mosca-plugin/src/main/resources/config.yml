language: en   # language of in-game messages: en or it (editable files in plugins/Mosca/lang/)

# Address of the brain server (scripts/02_server.py)
brain-url: "ws://127.0.0.1:8765"

# Body: the mob that acts as the body of the fly's brain. Any mob works
# (ALLAY, BEE, PARROT, BAT...): the brain is still the FlyWire Drosophila one.
# Flies already in game keep their old body: remove them and spawn them again.
body:
  entity: ALLAY
  name: "Mosca"        # name above the head (followed by the number and the hearts)
  baby: false         # true = baby, for mobs that have one (a baby bee is smaller)

# Maximum distance (in blocks) at which the fly sees players and smells odors
range: 16.0

# Walking: "full" speed and steering in the game.
walk:
  max-speed: 1.5       # blocks per second at full speed
  max-turn: 120.0      # degrees per second at full steering
  smoothing: 0.25      # 0..1: lower = smoother movements but slower to react
  hover-height: 0.6    # how high it stays above the ground (blocks)

# The "spinal cord": in a real fly walking is generated by the ventral nerve cord (VNC),
# which FlyWire does not contain. Here the plugin does it: the fly wanders on its own, and
# when the brain perceives an odor it heads toward (or away from) where the odor is.
spinal:
  wander-speed: 0.35   # fraction of max-speed while wandering
  activity: 0.6        # 0..1: how often it is moving rather than standing still
  # Body reflex: in a real fly a blow to the body makes it jump away through the
  # ventral nerve cord (VNC), which FlyWire does not contain. A blow at least as strong as
  # this threshold makes it flee immediately. A punch is worth about 0.3 (it feels it and
  # grooms), a sword 1 (it flees). 0 = off, only the brain decides.
  hit-reflex: 0.6

# Births: how many flies each player can have (0 = no limit). On top of this the
# brain PC limit applies (the server's --spawn-rt). /mosca spawn force
# skips both checks.
spawn:
  max-per-player: 1

# Nest: a composter filled ONLY with fruit, instead of producing bone meal, hatches
# a fly (Drosophila lays its eggs in fermenting fruit). A single different item,
# or a hopper, turns it back into a normal composter until you empty it.
# The fly belongs to whoever put in the last fruit and respects the limits above.
nest:
  enabled: true
  hatch-seconds: 20    # how long the full composter "ferments" before the fly hatches
  # In parentheses: the vanilla chance that an item raises the composter level
  fruits:
    - APPLE           # 65%
    - MELON_SLICE     # 50%
    - MELON           # 65%, the whole melon
    - PUMPKIN         # 65%
    - SWEET_BERRIES   # 30%
    - GLOW_BERRIES    # 30%

# Health: the fly has the Allay's health points (20 = 10 hearts), shown in its name.
# Eating restores health.
health:
  heal-per-bite: 2.0   # health points restored every 3 seconds of feeding (2 = one heart)

# Memory: the fly learns who you are from your odor (every player has their own). If it
# eats while you are close, your odor becomes "good"; if you hit it, "bad". This is learned
# by the brain's mushroom body (scripts/memory.py); here only how the body uses it.
memory:
  min-valence: 0.1       # below this valence (in absolute value) a player is indifferent to it
  follow-valence: 0.15   # above this: if you fall behind it follows you in flight
  follow-distance: 4.0   # blocks beyond which it takes off to follow you
  keep-distance: 2.0     # blocks at which it stops near you
  # Like pets: if the player it likes most (at least teleport-valence) is farther
  # than this, or in another world, it appears next to them. 0 = off (more realistic).
  teleport-distance: 20.0
  teleport-valence: 0.2

# Flight: like walking, the flight rhythm is generated by the "spinal cord" (the nerve cord
# is not in FlyWire). Straight stretches interrupted by rapid turns, like a real Drosophila.
flight:
  chance: 0.004          # per-tick chance of taking off on its own while wandering (~every 12 s)
  speed: 4.0             # blocks per second in flight
  height: 2.0            # flight altitude above the ground (blocks)
  to-odor-distance: 6.0  # beyond this distance it flies toward an attractive odor instead of walking

# Innate preference for each odor: + = approaches it, - = avoids it (from -1 to 1)
valence:
  fruity: 1.0
  rotten: -1.0

# Odors: item (held by a player or dropped on the ground) -> odor for the brain.
# Available odors: fruity (attractive), rotten (aversive)
odors:
  APPLE: fruity
  GOLDEN_APPLE: fruity
  SWEET_BERRIES: fruity
  GLOW_BERRIES: fruity
  MELON_SLICE: fruity
  HONEY_BOTTLE: fruity
  SUGAR: fruity
  ROTTEN_FLESH: rotten
  SPIDER_EYE: rotten
  FERMENTED_SPIDER_EYE: rotten
  POISONOUS_POTATO: rotten
